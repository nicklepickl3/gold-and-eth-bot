name: gold-bot
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
concurrency:
  group: gold-bot
  cancel-in-progress: true
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install websockets requests
      - run: timeout 350m python -u goldbot.py run || [ $? -eq 124 ]
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DERIV_TOKEN: ${{ secrets.DERIV_TOKEN }}
